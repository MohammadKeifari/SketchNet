<button type="button"
        class="share-trigger {{ extra_class|default:'icon-btn' }}"
        data-share-url="{{ share_url }}"
        data-share-title="{{ share_title }}"
        data-share-kind="{{ share_kind }}"
        data-share-id="{{ share_id }}"
        data-share-owner="{% if owner and user == owner %}1{% endif %}"
        data-share-view="{{ view_access|default:'' }}"
        data-share-fork="{{ fork_access|default:'' }}"
        data-share-private="{% if is_private %}1{% endif %}"
        title="Share"
        aria-label="Share">
    <svg width="{{ icon_size|default:15 }}"
         height="{{ icon_size|default:15 }}"
         viewBox="0 0 24 24"
         fill="none"
         stroke="currentColor"
         stroke-width="2">
        <circle cx="18" cy="5" r="3" />
        <circle cx="6" cy="12" r="3" />
        <circle cx="18" cy="19" r="3" />
        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49" />
        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49" />
    </svg>
    {% if labeled %}
        Share
    {% endif %}
</button>
