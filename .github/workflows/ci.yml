name: CI

on:
  push:
    branches: [main, master, test/**]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Django tests
        env:
          SECRET_KEY: ci-test-secret-key
          DEBUG: "True"
          ALLOWED_HOSTS: localhost,127.0.0.1
        run: python manage.py test sketchmod data_manager models_library accounts setting bug_reports
      - name: Codegen model suite
        env:
          PYTHONIOENCODING: utf-8
          SECRET_KEY: ci-test-secret-key
          DEBUG: "True"
          ALLOWED_HOSTS: localhost,127.0.0.1
        run: python sketchmod/tests/codegen/test_models.py --mode auto
